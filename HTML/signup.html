<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CabifyPool - Sign Up</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="../CSS/auth.css ">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

  <script src="auth.js" defer></script>
</head>

<body class="signup-page">

  <div class="container">

    <div class="left-content">

      <div class="logo">
        <i class="fa-solid fa-car-side"></i>
        <span>CabifyPool</span>
      </div>

      <div class="hero">
        <h1>Join the Ride.<br><span>Start Saving.</span></h1>
        <p class="subtitle">
          Create your CabifyPool account and start sharing rides with trusted people.
        </p>
      </div>

      <div class="features">

        <div class="feature-box">
          <i class="fa-solid fa-users"></i>
          <h3>Trusted</h3>
          <p>Community</p>
        </div>

        <div class="feature-box">
          <i class="fa-solid fa-shield-halved"></i>
          <h3>Secure</h3>
          <p>Rides</p>
        </div>

        <div class="feature-box">
          <i class="fa-solid fa-wallet"></i>
          <h3>Save</h3>
          <p>More</p>
        </div>

      </div>

    </div>

    <div class="login-card">

      <div class="tabs">
        <button type="button" onclick="window.location.href='login.html'">Login</button>
        <button type="button" class="active">Sign Up</button>
      </div>

      <h2>Create Account</h2>
      <p class="small">Sign up to continue</p>

      <form id="signupForm">

        <div class="input-box">
          <i class="fa-regular fa-user"></i>
          <input type="text" id="name" placeholder="Enter your name" required>
        </div>

        <div class="input-box">
          <i class="fa-regular fa-envelope"></i>
          <input type="email" id="signupEmail" placeholder="Enter your email" required>
        </div>

        <div class="input-box">
          <i class="fa-solid fa-lock"></i>
          <input type="password" id="signupPassword" placeholder="Create password" required minlength="6">
        </div>

        <button type="submit" class="login-btn">Sign Up</button>

      </form>

      <div class="divider">or continue with</div>

      <div class="social-buttons">
        <button type="button"><i class="fa-brands fa-google"></i></button>
        <button type="button"><i class="fa-brands fa-apple"></i></button>
        <button type="button"><i class="fa-brands fa-facebook-f"></i></button>
      </div>

      <p class="signup-text">
        Already have an account? <a href="login.html">Login</a>
      </p>

    </div>

  </div>

</body>
</html>
