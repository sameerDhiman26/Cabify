<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CabifyPool - Login</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script src="auth.js" defer></script>
  <link rel="stylesheet" href="/Cabify/CSS/auth.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
</head>

<body>

  <div class="container">

    <!-- LEFT SIDE -->
    <div class="left-content">

      <div class="logo">
        <i class="fa-solid fa-car-side"></i>
        <span>CabifyPool</span>
      </div>

      <div class="hero">
        <h1>Share Rides.<br><span>Save More.</span></h1>
        <p class="subtitle">
          Your ride, your way. Connect. Travel. Save together.
        </p>
      </div>

      <div class="features">

        <div class="feature-box">
          <i class="fa-solid fa-users"></i>
          <h3>Trusted</h3>
          <p>Community</p>
        </div>

        <div class="feature-box">
          <i class="fa-solid fa-shield-halved"></i>
          <h3>Secure</h3>
          <p>Rides</p>
        </div>

        <div class="feature-box">
          <i class="fa-solid fa-wallet"></i>
          <h3>Save</h3>
          <p>More</p>
        </div>

      </div>

    </div>

    <!-- RIGHT SIDE -->
    <div class="login-card">

      <div class="tabs">
        <button type="button" class="active">Login</button>
        <button type="button" onclick="window.location.href='signup.html'">Sign Up</button>
      </div>
      <h2>Welcome Back </h2>
      <p class="small">Login to continue</p>

      <form id="loginForm">

        <div class="input-box">
          <i class="fa-regular fa-envelope"></i>
          <input type="email" id="email" placeholder="Enter your email" required>
        </div>

        <div class="input-box">
          <i class="fa-solid fa-lock"></i>
          <input type="password" id="password" placeholder="Enter your password" required>
        </div>

        <div class="options">
          <label><input type="checkbox" id="remember"> Remember me</label>
          <a href="#">Forgot Password?</a>
        </div>
        <button type="submit" class="login-btn">Login</button>

      </form>

      <div class="divider">or continue with</div>

      <div class="social-buttons">
        <button type="button"><i class="fa-brands fa-google"></i></button>
        <button type="button"><i class="fa-brands fa-apple"></i></button>
        <button type="button"><i class="fa-brands fa-facebook-f"></i></button>
      </div>

      <p class="signup-text">
        Don't have an account? <a href="signup.html">Sign Up</a>
      </p>
    </div>

  </div>

</body>

</html>
