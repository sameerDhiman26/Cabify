<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="../CSS/rides.css" />
    <title>Document</title>
  </head>
  <body>
    <main class="main-section">
      <section class="top-main">
        <div class="top-header">
          <h2>Rides Given</h2>
          <p>Trips you have published and their booked passengers</p>
        </div>
        <a href="" class="offer-link">Offer new Ride</a>
      </section>

      <section class="filter-section">
        <button class="filter-btn active">Active Rides</button>
        <button class="filter-btn">Completed</button>
        <button class="filter-btn">Cancelled</button>
      </section>
      <section class="booking-box">
        <section id="ridesList" class="empty-box">
          <p>No rides offered yet</p>
        </section>
      </section>
    </main>
  </body>
</html>
